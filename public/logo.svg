
<svg width="48" height="48" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="24" y1="0" x2="24" y2="48" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1745B5"/>
    </linearGradient>

    <linearGradient id="shine" x1="24" y1="9" x2="24" y2="39" gradientUnits="userSpaceOnUse">
      <stop stop-color="white" stop-opacity=".95"/>
      <stop offset="1" stop-color="white" stop-opacity=".55"/>
    </linearGradient>

    <linearGradient id="overlay" x1="24" y1="0" x2="26" y2="48" gradientUnits="userSpaceOnUse">
